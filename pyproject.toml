[project]
name = "pc-energy-optimizer"
version = "0.2.0"
description = "Background agent letting Home Assistant manage PC power over the tailnet"
requires-python = ">=3.11"
dependencies = [
    "psutil>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pc_energy_optimizer"]
